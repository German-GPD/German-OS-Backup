[package]
name = "german-os-backup"
version = "1.2.0"
edition = "2024"
authors = ["German-GPD"]
description = "Local-first Windows backup utility"
license = "MIT"

[[bin]]
name = "GermanOSBackup"
path = "src-rust/main.rs"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2.5"
sysinfo = "0.33"
directories = "6"
