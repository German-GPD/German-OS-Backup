[package]
name = "german-os-backup"
version = "1.4.0"
edition = "2024"
authors = ["German-GPD"]
description = "German OS Backup Rust Edition — local-first Windows backup utility"
license = "MIT"

[[bin]]
name = "GermanOSBackup-Rust"
path = "src-rust/main.rs"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
wry = "0.57"
winit = "0.30"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2.5"
sysinfo = "0.33"
directories = "6"

sha2 = "0.10"
filetime = "0.2"
notify = "8"
zip = { version = "2", default-features = false, features = ["deflate"] }
