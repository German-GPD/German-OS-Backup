name: German OS Backup CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backup-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: version
        shell: pwsh
        run: |
          $v = (Get-Content version.txt -Raw).Trim()
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid version.txt: $v" }
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: Audit repository consistency
        shell: pwsh
        run: .\scripts\repository-audit.ps1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Check Rust formatting
        run: cargo fmt --manifest-path .\native-engine\Cargo.toml -- --check
      - name: Test Rust backup engine
        run: cargo test --manifest-path .\native-engine\Cargo.toml --target x86_64-pc-windows-msvc
      - name: Run Rust static analysis
        run: cargo clippy --manifest-path .\native-engine\Cargo.toml --all-targets --target x86_64-pc-windows-msvc -- -D warnings
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore .NET dependencies
        run: dotnet restore .\src\GermanOSBackup\GermanOSBackup.csproj
      - name: Build .NET application
        run: dotnet build .\src\GermanOSBackup\GermanOSBackup.csproj -c Release --no-restore
      - name: Publish Windows x64 application
        run: dotnet publish .\src\GermanOSBackup\GermanOSBackup.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:Version=${{ steps.version.outputs.version }} -o .\publish
      - name: Bundle Rust engine
        shell: pwsh
        run: |
          $native = ".\native-engine\target\x86_64-pc-windows-msvc\release\german_os_backup_engine.dll"
          if (!(Test-Path $native)) { throw "Rust native engine missing: $native" }
          Copy-Item $native ".\publish\german_os_backup_engine.dll"
      - name: Download official WebView2 bootstrapper
        shell: pwsh
        run: |
          $bootstrapper = ".\publish\MicrosoftEdgeWebView2Setup.exe"
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile $bootstrapper
          if (!(Test-Path $bootstrapper) -or (Get-Item $bootstrapper).Length -lt 100000) {
            throw "Microsoft WebView2 bootstrapper download is missing or invalid."
          }
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Package installer
        run: iscc /DAppVersion=${{ steps.version.outputs.version }} .\installer\GermanOSBackup.iss
      - name: Verify installer and create checksum
        shell: pwsh
        run: |
          $installer = ".\installer\output\GermanOSBackup-Setup-x64.exe"
          if (!(Test-Path $installer)) { throw "Installer missing: $installer" }
          $hash = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
          "$hash  GermanOSBackup-Setup-x64.exe" | Set-Content ".\SHA256SUMS.txt" -Encoding utf8NoBOM
      - uses: actions/upload-artifact@v4
        with:
          name: GermanOSBackup-release-files
          path: |
            .\installer\output\GermanOSBackup-Setup-x64.exe
            .\SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(tr -d '\r\n' < version.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: GermanOSBackup-release-files
          path: release-files
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: main
          name: German OS Backup ${{ steps.version.outputs.version }}
          body: |
            German OS Backup for Windows x64.
            SHA256SUMS.txt contains the SHA-256 checksum of the installer.
            The installer is not Authenticode-signed; Windows SmartScreen may warn about an unknown publisher.
          files: |
            release-files/GermanOSBackup-Setup-x64.exe
            release-files/SHA256SUMS.txt
          overwrite_files: true
          make_latest: true
          fail_on_unmatched_files: true
