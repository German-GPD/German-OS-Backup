name: Validate Rust Edition
on:
  push:
    branches: [rust]
  pull_request:
    branches: [rust]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rust-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build Rust Edition
        run: cargo build --release --target x86_64-pc-windows-msvc
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Package Rust Edition
        run: iscc /DAppVersion=1.3.0 .\installer\GermanOSBackup-Rust.iss
      - name: Verify installer
        shell: pwsh
        run: |
          $installer = ".\installer\output\GermanOSBackup-Rust-Setup-x64.exe"
          if (!(Test-Path $installer)) { throw "Rust installer missing: $installer" }
          if ((Get-Item $installer).Length -lt 1MB) { throw "Rust installer unexpectedly small." }
      - uses: actions/upload-artifact@v4
        with:
          name: GermanOSBackup-Rust-Setup-x64
          path: .\installer\output\GermanOSBackup-Rust-Setup-x64.exe
          if-no-files-found: error
          retention-days: 30
