name: Build Windows app
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish self-contained EXE
        run: dotnet publish .\src\GermanOSBackup\GermanOSBackup.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o .\publish
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path .\publish\GermanOSBackup.exe -DestinationPath .\GermanOSBackup-win-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: GermanOSBackup-win-x64
          path: GermanOSBackup-win-x64.zip
          if-no-files-found: error
      - name: Attach tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: GermanOSBackup-win-x64.zip
          generate_release_notes: true
