name: Build unified German OS Backup
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: unified-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: version
        shell: pwsh
        run: |
          $v = (Get-Content version.txt -Raw).Trim()
          "version=$v" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore and build
        run: dotnet restore .\src\GermanOSBackup\GermanOSBackup.csproj
      - name: Publish single Windows application
        run: dotnet publish .\src\GermanOSBackup\GermanOSBackup.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:Version=${{ steps.version.outputs.version }} -o .\publish
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Package one installer
        run: iscc /DAppVersion=${{ steps.version.outputs.version }} .\installer\GermanOSBackup.iss
      - name: Verify installer and create checksum
        shell: pwsh
        run: |
          $installer = ".\installer\output\GermanOSBackup-Setup-x64.exe"
          if (!(Test-Path $installer)) { throw "Installer missing: $installer" }
          $hash = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
          "$hash  GermanOSBackup-Setup-x64.exe" | Set-Content ".\SHA256SUMS.txt" -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: GermanOSBackup-Setup-x64
          path: |
            .\installer\output\GermanOSBackup-Setup-x64.exe
            .\SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90
      - name: Publish release
        if: github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release:')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: main
          name: German OS Backup ${{ steps.version.outputs.version }}
          body: |
            Единая версия German OS Backup для Windows x64.
            SHA256SUMS.txt содержит контрольную сумму установщика.
            Установщик не подписан Authenticode; Windows SmartScreen может предупредить о неизвестном издателе.
          files: |
            installer/output/GermanOSBackup-Setup-x64.exe
            SHA256SUMS.txt
          overwrite_files: true
          make_latest: true
          fail_on_unmatched_files: true
