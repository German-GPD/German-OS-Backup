name: Build Rust and C# editions
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: editions-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: version
        shell: pwsh
        run: echo "version=$((Get-Content version.txt -Raw).Trim())" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@v4
        with:
          ref: rust
          path: rust-source
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build Rust Edition
        run: cargo build --manifest-path .\rust-source\Cargo.toml --release --target x86_64-pc-windows-msvc --target-dir .\rust-source\target
      - name: Prepare Rust installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .\rust-source\publish | Out-Null
          Copy-Item .\rust-source\target\x86_64-pc-windows-msvc\release\GermanOSBackup-Rust.exe .\rust-source\publish\GermanOSBackup-Rust.exe
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Package Rust Edition
        run: iscc /DAppVersion=${{ steps.version.outputs.version }} .\rust-source\installer\GermanOSBackup-Rust.iss
      - uses: actions/checkout@v4
        with:
          ref: cs
          path: cs-source
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build C# Edition
        run: dotnet publish .\cs-source\src\GermanOSBackup\GermanOSBackup.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o .\cs-source\publish
      - name: Package C# Edition
        run: iscc /DAppVersion=${{ steps.version.outputs.version }} .\cs-source\installer\GermanOSBackup-CS.iss
      - uses: actions/upload-artifact@v4
        with:
          name: GermanOSBackup-Rust-Setup-x64
          path: .\rust-source\installer\output\GermanOSBackup-Rust-Setup-x64.exe
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: GermanOSBackup-CS-Setup-x64
          path: .\cs-source\installer\output\GermanOSBackup-CS-Setup-x64.exe
          if-no-files-found: error
          retention-days: 90
      - name: Verify both installers exist
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $rust = ".\rust-source\installer\output\GermanOSBackup-Rust-Setup-x64.exe"
          $cs = ".\cs-source\installer\output\GermanOSBackup-CS-Setup-x64.exe"
          if (!(Test-Path $rust)) { throw "Rust installer missing: $rust" }
          if (!(Test-Path $cs)) { throw "C# installer missing: $cs" }
          Write-Host "Both installers exist. Release may proceed."
      - name: Publish both installers
        if: github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release:')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: main
          name: German OS Backup ${{ steps.version.outputs.version }} — Rust + C#
          body: |
            Две редакции German OS Backup для Windows x64:
            - GermanOSBackup-Rust-Setup-x64.exe — нативная Rust Edition.
            - GermanOSBackup-CS-Setup-x64.exe — C# Edition с WebView2.
            Настройки и резервные копии хранятся отдельно от файлов программы.
          files: |
            rust-source/installer/output/GermanOSBackup-Rust-Setup-x64.exe
            cs-source/installer/output/GermanOSBackup-CS-Setup-x64.exe
          overwrite_files: true
          make_latest: true
          fail_on_unmatched_files: true
