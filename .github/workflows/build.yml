name: Build and package Windows installer
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read current version
        id: version
        shell: pwsh
        run: echo "version=$((Get-Content version.txt -Raw).Trim())" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Generate branded Windows icon
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $bitmap = New-Object System.Drawing.Bitmap 64,64
          $g = [System.Drawing.Graphics]::FromImage($bitmap)
          $g.SmoothingMode = [System.Drawing.Drawing2D.SmoothingMode]::AntiAlias
          $g.Clear([System.Drawing.Color]::FromArgb(15,18,16))
          $frame = New-Object System.Drawing.Pen ([System.Drawing.Color]::FromArgb(151,240,171)), 2
          $g.DrawRectangle($frame,8,6,47,51)
          $green = New-Object System.Drawing.SolidBrush ([System.Drawing.Color]::FromArgb(151,240,171))
          $points = @([System.Drawing.Point]::new(18,18),[System.Drawing.Point]::new(45,18),[System.Drawing.Point]::new(45,24),[System.Drawing.Point]::new(25,24),[System.Drawing.Point]::new(25,30),[System.Drawing.Point]::new(40,30),[System.Drawing.Point]::new(40,36),[System.Drawing.Point]::new(25,36),[System.Drawing.Point]::new(25,42),[System.Drawing.Point]::new(45,42),[System.Drawing.Point]::new(45,48),[System.Drawing.Point]::new(18,48))
          $g.FillPolygon($green,$points)
          $handle = $bitmap.GetHicon()
          $icon = [System.Drawing.Icon]::FromHandle($handle)
          $stream = [System.IO.File]::Create("src/GermanOSBackup/app.ico")
          $icon.Save($stream); $stream.Dispose()
          $icon.Dispose(); $g.Dispose(); $bitmap.Dispose(); $frame.Dispose(); $green.Dispose()
      - name: Publish self-contained application
        run: dotnet publish .\src\GermanOSBackup\GermanOSBackup.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o .\publish
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build installer
        run: iscc /DAppVersion=${{ steps.version.outputs.version }} .\installer\GermanOSBackup.iss
      - uses: actions/upload-artifact@v4
        with:
          name: GermanOSBackup-Setup-x64
          path: .\installer\output\GermanOSBackup-Setup-x64.exe
          if-no-files-found: error
          retention-days: 90
      - name: Publish latest installer
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: main
          name: German OS Backup ${{ steps.version.outputs.version }} — Windows x64
          body: |
            Установщик German OS Backup ${{ steps.version.outputs.version }} для Windows x64.
            Запустите GermanOSBackup-Setup-x64.exe поверх предыдущей версии. Установщик обновляет файлы программы, а пользовательские настройки и папки резервных копий хранятся отдельно.
            При первом запуске мастер попросит выбрать место копии, источники и параметр автозапуска.
            Программа не подписана цифровым сертификатом, поэтому SmartScreen может предупредить о неизвестном издателе.
          files: installer/output/GermanOSBackup-Setup-x64.exe
          overwrite_files: true
          make_latest: true
          fail_on_unmatched_files: true