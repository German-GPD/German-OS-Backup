name: Build C# Edition
on:
  push:
    branches: [cs]
  pull_request:
    branches: [cs]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Read version
        id: version
        shell: pwsh
        run: echo "version=$((Get-Content version.txt -Raw).Trim())" >> $env:GITHUB_OUTPUT
      - name: Publish C# Edition
        run: dotnet publish .\src\GermanOSBackup\GermanOSBackup.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o .\publish
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build C# installer
        run: iscc /DAppVersion=${{ steps.version.outputs.version }} .\installer\GermanOSBackup-CS.iss
      - uses: actions/upload-artifact@v4
        with:
          name: GermanOSBackup-CS-Setup-x64
          path: .\installer\output\GermanOSBackup-CS-Setup-x64.exe
          if-no-files-found: error
          retention-days: 90
