name: Build Windows app
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish self-contained EXE
        run: dotnet publish .\src\GermanOSBackup\GermanOSBackup.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o .\publish
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path .\publish\GermanOSBackup.exe -DestinationPath .\GermanOSBackup-win-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: GermanOSBackup-win-x64
          path: GermanOSBackup-win-x64.zip
          if-no-files-found: error
          retention-days: 90
      - name: Publish stable download
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          target_commitish: main
          name: German OS Backup — Windows x64
          body: |
            Стабильная сборка German OS Backup для Windows x64.

            Скачайте GermanOSBackup-win-x64.zip, распакуйте архив и запустите GermanOSBackup.exe.
            Программа пока не подписана цифровым сертификатом; Windows SmartScreen может показать предупреждение.
          files: GermanOSBackup-win-x64.zip
          make_latest: true
          fail_on_unmatched_files: true
