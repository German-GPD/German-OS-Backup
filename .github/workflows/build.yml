name: Build and package Windows installer
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish self-contained application
        run: dotnet publish .\src\GermanOSBackup\GermanOSBackup.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o .\publish
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build installer
        run: iscc .\installer\GermanOSBackup.iss
      - uses: actions/upload-artifact@v4
        with:
          name: GermanOSBackup-Setup-x64
          path: .\installer\output\GermanOSBackup-Setup-x64.exe
          if-no-files-found: error
          retention-days: 90
      - name: Publish latest installer
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          target_commitish: main
          name: German OS Backup — Windows x64
          body: |
            Установщик German OS Backup для Windows x64.
            Скачайте GermanOSBackup-Setup-x64.exe и запустите. Установщик добавит автозапуск; при первом старте приложение предупредит о нагрузке и попросит выбрать папку копии.
            Программа не подписана цифровым сертификатом, поэтому SmartScreen может предупредить о неизвестном издателе.
          files: installer/output/GermanOSBackup-Setup-x64.exe
          make_latest: true
          fail_on_unmatched_files: true